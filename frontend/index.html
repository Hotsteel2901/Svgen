<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="SVGen Studio — draw SVG illustrations, animate them on a keyframe timeline, and export stills or video.">
<title>SVGen Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23cbff4d'/%3E%3Cpath d='M16 7l2.3 6.2 6.7.4-5.2 4 1.8 6.4L16 20.4 10.4 24l1.8-6.4-5.2-4 6.7-.4z' fill='%230a0b0d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/colorpicker.css">
</head>
<body>
  <div id="app">
    <div class="shell" id="shell">
      <header class="top" id="topbar" role="toolbar" aria-label="Document"></header>

      <aside class="rail" id="rail" role="toolbar" aria-label="Tools"></aside>

      <main class="stage" id="stage-host" aria-label="Canvas"></main>

      <aside class="dock" id="dock" aria-label="Panels"></aside>

      <section class="time" id="timeline" aria-label="Timeline"></section>

      <footer class="status">
        <span class="msg" id="status-msg"></span>
        <span class="grow"></span>
        <span class="right">
          <button class="btn icon sm" id="help-btn" type="button" aria-label="Shortcuts">?</button>
          <span class="sfoot" id="status-foot"></span>
          <span class="sfoot mono" id="app-version"></span>
        </span>
      </footer>
    </div>
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="empty" style="padding:40px;text-align:center">
      SVGen Studio needs JavaScript enabled.
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
