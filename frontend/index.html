<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVGen Studio — SVG Drawing & Animation</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#6366f1"/><circle cx="16" cy="16" r="7" fill="white"/></svg>
      <div class="brand-text"><b>SVGen</b><span>Studio</span></div>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="new-file" title="New canvas (Ctrl+N)">New</button>
      <button class="tb-btn" id="open-file" title="Open scene (.json)">Open</button>
      <button class="tb-btn" id="save-file" title="Save scene (Ctrl+S)">Save</button>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="import-svg" title="Import SVG shapes">SVG</button>
      <button class="tb-btn" id="grid" title="Toggle grid">Grid</button>
      <span class="tb-sep"></span>
      <button class="tb-btn icon" id="undo" title="Undo (Ctrl+Z)">↺</button>
      <button class="tb-btn icon" id="redo" title="Redo (Ctrl+Y)">↻</button>
      <span class="tb-sep"></span>
      <button class="tb-btn icon" id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label" class="tb-label">100%</span>
      <button class="tb-btn icon" id="zoom-in" title="Zoom in">+</button>
      <button class="tb-btn icon" id="zoom-fit" title="Fit">⤢</button>
    </div>
    <div class="tb-right">
      <span class="engine-pill" id="engine-pill" title="Backend status">…</span>
      <button class="tb-btn primary" id="btn-export-go" title="Open export panel">Export</button>
    </div>
  </header>

  <!-- Left tool rail -->
  <aside id="toolrail">
    <div class="rail-group" data-group="draw">
      <button class="tool-btn" data-tool="select" title="Select / Move (V)">⌖</button>
      <button class="tool-btn" data-tool="pen" title="Freehand pen (P)">✏️</button>
      <button class="tool-btn" data-tool="path" title="Smooth path (B)">🖊</button>
      <button class="tool-btn" data-tool="text" title="Text (T)">T</button>
    </div>
    <div class="rail-group" data-group="shape">
      <button class="tool-btn" data-tool="rect" title="Rectangle (R)">▭</button>
      <button class="tool-btn" data-tool="rounded" title="Rounded rectangle">▢</button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)">⬭</button>
      <button class="tool-btn" data-tool="line" title="Line (L)">╱</button>
      <button class="tool-btn" data-tool="arrow" title="Arrow (A)">➤</button>
      <button class="tool-btn" data-tool="poly" title="Polygon (G)">⬠</button>
      <button class="tool-btn" data-tool="star" title="Star (S)">★</button>
    </div>
    <div class="rail-group" data-group="style">
      <label class="swatch-btn" title="Fill color">
        <input type="color" id="t-fill" value="#6366f1">
        <span class="swatch-badge" id="fill-badge">F</span>
      </label>
      <label class="swatch-btn" title="Stroke color">
        <input type="color" id="t-stroke" value="#e2e8f0">
        <span class="swatch-badge" id="stroke-badge">S</span>
      </label>
      <label class="width-btn" title="Stroke width">
        <input type="range" id="t-stroke-w" min="1" max="24" value="3">
        <span id="stroke-w-label">3</span>
      </label>
    </div>
    <div class="rail-spacer"></div>
    <div class="rail-group">
      <button class="tool-btn" id="clear-all" title="Clear canvas">🗑</button>
    </div>
  </aside>

  <!-- Stage -->
  <main id="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="hint-pill">Draw with the tools on the left · click a shape, then use the timeline below to animate it</div>
  </main>

  <!-- Right panel -->
  <aside id="sidepanel">
    <div class="side-tabs">
      <button class="side-tab active" data-tab="properties">Properties</button>
      <button class="side-tab" data-tab="layers">Layers</button>
      <button class="side-tab" data-tab="export">Export</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <!-- Timeline -->
  <section id="timeline"></section>

  <!-- Status bar -->
  <footer id="statusbar">
    <span id="status-text">Ready</span>
    <span class="sb-right">⌖ select · P pen · R rect · K keyframe · Space pan</span>
  </footer>
</div>

<input type="file" id="file-open" accept=".json,application/json" hidden>
<input type="file" id="file-svg" accept=".svg,image/svg+xml" hidden>

<script src="js/store.js"></script>
<script src="js/draw.js"></script>
<script src="js/api.js"></script>
<script src="js/tools.js"></script>
<script src="js/timeline.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
